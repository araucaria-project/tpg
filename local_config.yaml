# Local tpg config for the OCM control-room machines: copy to ~/.config/tpg/local_config.yaml
#
# Merged over tpg/config.yaml key by key (deep_update), so list ONLY what really
# differs on this machine. Every copied field hides later changes of the repo
# defaults - in particular do NOT put master_file / start_makro / end_makro / skyflat
# paths here: the defaults already point at the ocm-plans checkout on NFS
# (/data/misc/ocm-plans/master/<tel>/...).

# generated plans + their logs: local disk of this machine
# (run log of tpg, not shared, not in ocm-plans)
plan_catalog: "/home/observer/src/tpg/plans"

# per-telescope overrides, only if this machine needs them, e.g.:
# wk06:
#   hmax: 85
