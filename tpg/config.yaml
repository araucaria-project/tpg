# Following setting should be removed, and values from global config used instead
# hmin, hmax, def_read_mode, rm_modes_mhz
# Following settings may be moved to global config:
# overhead, hsun, wind_dist, moon_dist

obs_lat: -24.598
obs_lon: -70.1963
obs_elev: 2817

local_config: "~/.config/tpg/local_config.yaml"
plan_catalog: "~/tpg_plans/"


wk06:
  master_file: /home/observer/src/tpg/master_files/wk06_master.txt        # file with OB definitions
  start_makro: /home/observer/src/tpg/master_files/wk06_start_makro.txt
  end_makro: /home/observer/src/tpg/master_files/wk06_end_makro.txt
  data_file: /data/fits/wk06/processed-ofp/targets/          # directory with observations
  def_read_mode: 2
  overhead: 15                                               # overhead for time slot calculation
  hmin: 35                                                   # min altitude to observe
  hmax: 91                                                   # max altitude to observe
  hsun: -18                                                  # Sun alt to start and stop obs
  wind_dist: 30                                              # wind distance to avoid in dome azimuth
  moon_dist: 40                                              # distance to avoid moon
  night_monitor_gap: 30                                      # [min] break between observations in --night_monitor mode
  dome:                                                      # no block = dome follows telescope azimuth
    mount: gem                                               # dome azimuth from GEM geometry, both sides of pier
    r_dome: 2050                                             # [mm] dome radius
    spx: -110                                                # [mm] dome center -> ra/dec axes, (+) E / (-) W
    spy: -110                                                # [mm] dome center -> ra/dec axes, (+) N / (-) S
    gem: 670                                                 # [mm] ra/dec axes -> optical axis


