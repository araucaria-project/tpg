# Following setting should be removed, and values from global config used instead
# hmin, hmax, def_read_mode, rm_modes_mhz
# Following settings may be moved to global config:
# overhead, hsun, wind_dist, moon_dist

obs_lat: -24.598
obs_lon: -70.1963
obs_elev: 2817

local_config: "~/.config/tpg/local_config.yaml"
plan_catalog: "~/tpg_plans/"                     # generated plans + logs: local disk on purpose (run log, not shared)

# sky flat selector (sfs) - defaults, a telescope block may override fields in its own `skyflat:`
# block; `fields_file` is required there (no default - every telescope names its fields file)
skyflat:
  hsun: [-15, 1]                                             # Sun altitude range of a session
  hmin: 40                                                   # field altitude limits, whole session
  hmax: 78
  sun_az_dist: 100                                           # min field azimuth distance from the Sun
  n: 7                                                       # frames per filter in the SKYFLAT seq
  exp: a                                                     # exposure per frame, a = auto exposure
  # moon_dist and wind_dist are taken from the telescope block unless set here
  # groups (per telescope): ordered filter groups, darkest flats first; one filter per group per
  # session, the one with the oldest flats; evening in this order, morning reversed. An entry is a
  # filter (n/exp above) or a full sequence for it, e.g. 5/Ic/3, used as given
  # evening_makro / morning_makro (per telescope, optional): whole flat session for tpg --skyflats, e.g. WAIT/BELL/ZERO
  # around a bare SKYFLAT line that tpg replaces with the sfs choice; # lines are not copied; no makro = bare SKYFLAT line


# Masters, makros and sky flat fields come from the ocm-plans checkout on NFS (/data/misc/ocm-plans,
# synced with github.com/araucaria-project/ocm-plans every 2 min). Never edit them here.

wk06:
  master_file: /data/misc/ocm-plans/master/wk06/wk06_master.txt        # file with OB definitions
  start_makro: /data/misc/ocm-plans/master/wk06/wk06_start_makro.txt
  end_makro: /data/misc/ocm-plans/master/wk06/wk06_end_makro.txt
  data_file: /data/fits/wk06/processed-ofp/targets/          # directory with observations
  def_read_mode: 2
  overhead: 15                                               # overhead for time slot calculation
  hmin: 35                                                   # min altitude to observe
  hmax: 91                                                   # max altitude to observe
  hsun: -18                                                  # Sun alt to start and stop obs
  wind_dist: 30                                              # wind distance to avoid in dome azimuth
  moon_dist: 40                                              # distance to avoid moon
  night_monitor_gap: 15                                      # [min] break between observations in --night_monitor mode
  skyflat:
    fields_file: /data/misc/ocm-plans/master/sky_flat_fields.txt  # sky flat fields, from ocm-plans
    groups: [[u_s], [v_s], [b_s,y_s], [B,V], [Ic]]
    evening_makro: /data/misc/ocm-plans/master/wk06/makro/wk06_evening_makro.txt              # evening flat session template, bare SKYFLAT line replaced by sfs
    morning_makro: /data/misc/ocm-plans/master/wk06/makro/wk06_morning_makro.txt              # morning flat session template
  dome:                                                      # no block = dome follows telescope azimuth
    mount: gem                                               # dome azimuth from GEM geometry, both sides of pier
    r_dome: 2050                                             # [mm] dome radius
    spx: -110                                                # [mm] dome center -> ra/dec axes, (+) E / (-) W
    spy: -110                                                # [mm] dome center -> ra/dec axes, (+) N / (-) S
    gem: 670                                                 # [mm] ra/dec axes -> optical axis


