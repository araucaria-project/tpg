[tool.poetry]
name = "tpg"
version = "1.0.2"
description = "telescope plan generator"
authors = ["mgorski <mgorski@camk.edu.pl>"]
license = "MIT"
readme = "README.md"
include = ['config.yaml']


[tool.poetry.dependencies]
python = "^3.10"
pyyaml = "^6.0"
ephem = "^4.1.4"
numpy = "^1.24.1"
astropy = ">=5.0.4,<5.1.0"


ctc = {git = "https://github.com/araucaria-project/ctc.git"}
pyaraucaria = {git = "https://github.com/araucaria-project/pyaraucaria.git"}



[tool.poetry.scripts]
tpg = "tpg:main"
chexp = "chexp:main"
group2master = "group2master:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

