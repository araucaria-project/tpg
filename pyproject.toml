[tool.poetry]
name = "tpg"
version = "0.0.3"
description = "telescope plan generator"
authors = ["mgorski <mgorski@camk.edu.pl>"]
license = "MIT"
readme = "README.md"
include = ['config.yaml']


[tool.poetry.dependencies]
python = "^3.10"
pyyaml = "^6.0"
ephem = "^4.1.4"
numpy = "^1.24.1"

ctc = {git = "https://github.com/araucaria-project/ctc.git"}


[tool.poetry.scripts]
tpg = "tpg:main"
chexp = "chexp:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

