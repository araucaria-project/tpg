# TODO: przejscie na uklad [project] (PEP 621) i na uv zamiast poetry - planowane
[tool.poetry]
name = "tpg"
version = "1.2.0"
description = "telescope plan generator"
authors = ["mgorski <mgorski@camk.edu.pl>"]
license = "MIT"
readme = "README.md"
include = ['config.yaml']

[tool.poetry.dependencies]
python = ">=3.10,<3.15"

pyyaml = "^6.0.2"
ephem = "^4.1.5"  # jeśli dostępna, inaczej zostaw 4.1.4
numpy = "^2.1.0"  # numpy 2.x wspiera nowe Pythony
tqdm = "^4.66.4"
astropy = ">=6.1.7,<8"  # Table.read jest tez w 7.x; ^6 wymuszal astropy niekompatybilne z numpy>=2.4 (usuniete np.in1d)

ctc = {git = "https://github.com/araucaria-project/ctc.git"}
pyaraucaria = {git = "https://github.com/araucaria-project/pyaraucaria.git"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.poetry.scripts]
tpg = "tpg.tpg:main"
sfs = "tpg.sfs:main"
chexp = "chexp:main"
group2master = "group2master:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"